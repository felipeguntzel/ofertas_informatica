name: Post pending deals to Telegram

on:
  schedule:
    # a cada hora, no minuto 0. Ajuste aqui se quiser outra frequência
    # (ex: "*/30 * * * *" para a cada 30 minutos).
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: post-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post pending deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m src.post_deals

      - name: Commit updated deals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          git diff --staged --quiet || git commit -m "chore: mark posted deals [skip ci]"
          git push
